<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js 펭귄</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: sans-serif; }
  #info {
    position: absolute; top: 12px; left: 0; right: 0; text-align: center;
    color: #1d3b4f; font-size: 14px; pointer-events: none;
  }
  #info h1 { font-size: 20px; margin: 0 0 4px; }
</style>
</head>
<body>
<div id="info">
  <h1>Three.js 펭귄</h1>
  드래그: 회전 · 두 손가락(휠): 확대/축소
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 1. 장면(Scene), 카메라, 렌더러
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f5);
scene.fog = new THREE.Fog(0xbfe3f5, 10, 25);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 2. 조명
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// 3. 재질(Material)
const black  = new THREE.MeshStandardMaterial({ color: 0x1b1f2a, roughness: 0.6 });
const white  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
const orange = new THREE.MeshStandardMaterial({ color: 0xff9a1f, roughness: 0.5 });
const ice    = new THREE.MeshStandardMaterial({ color: 0xeef8ff, roughness: 0.9 });

// 도형을 만들어 그룹에 추가하는 도우미 함수
function part(geometry, material, x, y, z, parent) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// 4. 펭귄 모델링 (기본 도형 조합)
const penguin = new THREE.Group();
scene.add(penguin);

// 몸통: 구를 세로로 늘림
const body = part(new THREE.SphereGeometry(1, 64, 64), black, 0, 1.2, 0, penguin);
body.scale.set(1, 1.3, 0.9);

// 배: 흰색 구를 앞쪽으로 살짝 내밀기
const belly = part(new THREE.SphereGeometry(0.8, 64, 64), white, 0, 1.1, 0.3, penguin);
belly.scale.set(1, 1.3, 0.8);

// 머리
const head = part(new THREE.SphereGeometry(0.65, 64, 64), black, 0, 2.75, 0, penguin);

// 얼굴의 흰 부분
const face = part(new THREE.SphereGeometry(0.5, 64, 64), white, 0, 2.7, 0.25, penguin);
face.scale.set(1, 0.9, 0.8);

// 눈 (흰자 + 눈동자)
for (const side of [-1, 1]) {
  part(new THREE.SphereGeometry(0.12, 16, 16), white, side * 0.2, 2.85, 0.6, penguin);
  part(new THREE.SphereGeometry(0.06, 16, 16), black, side * 0.2, 2.85, 0.7, penguin);
}

// 부리: 원뿔을 앞으로 눕힘
const beak = part(new THREE.ConeGeometry(0.12, 0.4, 16), orange, 0, 2.65, 0.75, penguin);
beak.rotation.x = Math.PI / 2;

// 날개: 납작한 구
const wings = [];
for (const side of [-1, 1]) {
  const wing = new THREE.Group();
  wing.position.set(side * 0.95, 1.9, 0);   // 어깨 위치(회전 중심)
  penguin.add(wing);
  const w = part(new THREE.SphereGeometry(0.5, 24, 24), black, 0, -0.6, 0, wing);
  w.scale.set(0.25, 1.1, 0.6);
  wing.rotation.z = side * 0.25;
  wings.push({ wing, side });
}

// 발
for (const side of [-1, 1]) {
  const foot = part(new THREE.SphereGeometry(0.3, 16, 16), orange, side * 0.4, 0.08, 0.4, penguin);
  foot.scale.set(1, 0.3, 1.4);
}

// 5. 바닥 (얼음판)
const ground = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.3, 0.3, 48), ice);
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

// 6. 카메라 컨트롤 (마우스/터치로 회전·확대)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 3;
controls.maxDistance = 15;

// 7. 애니메이션: 날개 파닥 + 뒤뚱뒤뚱
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  for (const { wing, side } of wings) {
    wing.rotation.z = side * (0.25 + Math.abs(Math.sin(t * 3)) * 0.4);
  }
  penguin.rotation.z = Math.sin(t * 2) * 0.05;
  penguin.position.y = Math.abs(Math.sin(t * 2)) * 0.08;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
